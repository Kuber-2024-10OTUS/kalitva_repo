apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-crd-sa
  namespace: homework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mysql-crd-clusterrole
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mysql-crd-clusterrolebinding
  namespace: homework
subjects:
- kind: ServiceAccount
  name: mysql-crd-sa
  namespace: homework
roleRef:
  kind: ClusterRole
  name: mysql-crd-clusterrole
  apiGroup: rbac.authorization.k8s.io
